<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5e2316" />
    <meta
      name="description"
      content="Discover Sereva. Thoughtfully chosen 925 sterling silver jewellery, for every day and every version of you."
    />
    <title>Sereva — A feeling, in silver.</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/assets/editorial.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/catalog.js"></script>
    <script defer src="/variations.js"></script>
    <script defer src="/content.js"></script>
    <script defer src="/store.js"></script>
  </head>
  <body>
    <a href="#main" class="skip">Skip to content</a>
    <div class="announcement">
      <span>925 STERLING SILVER</span
      ><span class="announcement-middle"
        >A little silver. A little more you.</span
      ><span>COMPLIMENTARY SHIPPING ACROSS INDIA</span>
    </div>
    <header class="header" id="header"></header>
    <main id="main" tabindex="-1">
      <div class="loading" aria-label="Loading storefront">
        <span class="wordmark">SEREVA</span><span>Discover your silver.</span>
      </div>
    </main>
    <footer id="footer" class="footer"></footer>
    <dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title"></h2>
        <button class="icon-button" data-close aria-label="Close panel">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div id="drawer-body"></div>
    </dialog>
    <dialog id="lightbox" class="lightbox" aria-label="Product image zoom">
      <button class="icon-button" data-close-zoom aria-label="Close image zoom">
        ✕</button
      ><img id="zoom-image" alt="" />
      <p>Scroll to explore the detail.</p>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <div class="preview-tag">
      DESIGN PREVIEW <span>·</span> No live orders or payments
    </div>
    <noscript
      ><p class="notice">
        Please enable JavaScript to explore the Sereva storefront. Shopping and
        account actions on this preview do not create live orders or accounts.
      </p></noscript
    >
  </body>
</html>
